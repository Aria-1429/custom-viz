<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 155 43" width="155" height="43" role="img" aria-label="DPX">
  <title>DPX</title>
  <!--
    アプリロゴ（appLogo.png / 155×43）用の横組みロックアップ。
    左に**タイル無しの素のマーク**、右に「DPX」のワードマーク。

    ⚠ ロゴにはタイル（角丸の濃紺＋グロー）を付けない。
      appLogo は明るい地に置かれることがあり、タイルがあると
      「四角い塊」が浮いて見えるため。タイル付きはアイコン専用。
    ⚠ **レターマークを白にも濃紺にもしない。** appLogo は
      **白地と暗い地の両方に置かれる**（実機で並べて撮影して確認）:
        - 白にすると白背景で消える
        - 濃紺にすると暗い背景で消える
      → **中間の青（#2b7fd4〜#38b6e8）**にして、どちらの地でもコントラストが立つようにした。
      アイコンは濃紺タイルが地を保証するので白のままでよい（用途で色を変える）。
    ⚠ 155×43 は実機の標準アプリ `search` の appLogo.png と同寸（計測して確認）。
  -->
  <defs>
    <linearGradient id="logoCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4f0"/>
      <stop offset="100%" stop-color="#5ee0ff"/>
    </linearGradient>
    <linearGradient id="logoWord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b7fd4"/>
      <stop offset="100%" stop-color="#38b6e8"/>
    </linearGradient>
  </defs>

  <!-- シンボル（128pt のマークを 38pt に縮めて左端へ） -->
  <g transform="translate(2.5, 2.5) scale(0.297)">
    <path d="M44 106 L86 32 L104 32 L62 106 Z" fill="url(#logoCyan)"/>
    <path fill="#2b7fd4"
          d="M20 24 L64 24 Q82 24 88 40 Q92 53 81 63 Q92 72 88 86 Q82 100 64 100
             L44 100 L44 120 L34 109 L34 100 L20 100 L20 40 L34 40 L34 86 L62 86
             Q73 86 73 77 Q73 69 62 69 L40 69 L40 55 L62 55 Q73 55 73 46
             Q73 38 62 38 L25 38 Z"/>
    <path d="M46 32 L64 32 L106 106 L88 106 Z" fill="url(#logoCyan)"/>
  </g>

  <!-- ワードマーク -->
  <text x="50" y="29"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="2.5"
        fill="url(#logoWord)">DPX</text>
</svg>
