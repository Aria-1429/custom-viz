<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="DPX">
  <title>DPX</title>
  <!--
    DPX のシンボル（参考デザイン準拠：角張ったレターマーク＋大きなシアンの X）。

    構成:
      - 白のレターマーク … D と P を1つの図形として重ねたもの。
        角は丸めず**斜めに切り落とす（面取り）**。P のステムは下へ抜けて先端が尖る。
      - シアンの X    … マーク全体を横切る2本の斜線。
        左下→右上は**白の背面**、左上→右下は**白の前面**を通して編み込む。

    ⚠ 調整の勘所（描いて確認した）:
      - X を太くしすぎると白の D/P を食い潰して読めなくなる。
        **X の腕は白の縦画より細く**する（ここでは腕幅 18 に対し白の縦画 20）
      - X は「小さな一画」ではなく**マークと同格の大きさ**にする。
        小さいと DPX の3文字目に見えず、ただの装飾線になる
      - stroke ではなく **path の塗り**で作る。stroke では交差部が同色で溶けるが、
        塗りなら重ね順で前後（編み込み）を作り分けられる
  -->
  <defs>
    <linearGradient id="dpxCyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4f0"/>
      <stop offset="100%" stop-color="#5ee0ff"/>
    </linearGradient>
  </defs>

  <!-- ── X：左下→右上（白マークの背面） ─────────────────────── -->
  <path d="M44 106 L86 32 L104 32 L62 106 Z" fill="url(#dpxCyan)"/>

  <!-- ── 白のレターマーク（D + P） ──────────────────────────── -->
  <g fill="#ffffff">
    <path d="M20 24
             L64 24
             Q82 24 88 40
             Q92 53 81 63
             Q92 72 88 86
             Q82 100 64 100
             L44 100
             L44 120
             L34 109
             L34 100
             L20 100
             L20 40
             L34 40
             L34 86
             L62 86
             Q73 86 73 77
             Q73 69 62 69
             L40 69
             L40 55
             L62 55
             Q73 55 73 46
             Q73 38 62 38
             L25 38
             Z"/>
  </g>

  <!-- ── X：左上→右下（白マークの前面） ─────────────────────── -->
  <path d="M46 32 L64 32 L106 106 L88 106 Z" fill="url(#dpxCyan)"/>
</svg>
